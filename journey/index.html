fa:[["هند · سنسکریت","پنچه‌تنتره","حکایت‌هایی برای آموختن آیین کشورداری به شاهزادگان.",0],["ایران · پهلوی · قرن ششم میلادی","برزویه","طبیب دربار انوشیروان کتاب را از هند می‌آورد. ترجمهٔ او از میان رفته است.",1],["عربی · حدود ۷۵۰ میلادی","ابن مقفع","ایرانی‌ای که به عربی می‌نوشت. همهٔ نسخه‌های بعدی از ترجمهٔ او می‌آیند.",1],["فارسی · قرن ششم هجری","نصرالله منشی","متن عربی را به نثر فنی فارسی برمی‌گرداند و با شعر می‌آراید. متنی که این پروژه می‌خواند.",2],["کاستیل · ۱۲۵۱ میلادی","کلیله و دمنهٔ کاستیلی","یکی از شاخه‌های اروپایی، ترجمه از عربی برای آلفونسوی دهم پیش از پادشاهی‌اش.",0],["هرات · فارسی · قرن نهم هجری","انوار سهیلی","بازنویسی تازهٔ حسین واعظ کاشفی که بارها نسخه‌برداری و نگارگری شد.",1]]};
H.add({en:{title:"The Journey",kicker:"The journey",h1:"A book that travelled",lead:"Four of its six stops pass through Persian hands; those are highlighted.",note:"Editorial summaries of each stop, not quotations."},
fa:{title:"سفر کتاب",kicker:"سفر کتاب",h1:"کتابی که سفر کرد",lead:"چهار منزل از شش منزل این سفر از دست ایرانیان گذشته است؛ آن‌ها پررنگ شده‌اند.",note:"خلاصه‌های تحریری هر منزل، نه نقل‌قول."}});
