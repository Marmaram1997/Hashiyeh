<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hashiyeh · Kalila and Dimna, read in the margins</title>
<meta name="description" content="A digital reading of Nasrollah Monshi's Persian Kelileh o Demneh.">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
:root,:root:not([data-x]){--bg:#F6ECDD;--ink:#1F1B16;--mute:#6B5F4E;--lapis:#2E4A9E;--orange:#A2471F;--gold:#B8963E;--note:clamp(19px,2.2vw,24px);--hl:clamp(28px,5vw,60px)}
@media(prefers-color-scheme:dark){:root,:root:not([data-x]){--bg:#F6ECDD;--ink:#1F1B16;--mute:#6B5F4E;--lapis:#2E4A9E;--orange:#A2471F}}
html,body{background:#F6ECDD}
.hero{height:100vh;height:100svh;display:flex;flex-direction:column;position:relative}
body{overflow-x:hidden}
.langtop.langsw{position:absolute;top:12px;right:20px;z-index:3;font-size:var(--note)}
.langtop button{font-size:inherit;padding:6px 8px;color:var(--mute)}
.langtop button[aria-pressed=true]{color:var(--lapis)}
.ident{text-align:center;padding:14px 20px 0}
.name{display:flex;justify-content:center;align-items:baseline;gap:14px;direction:ltr}
.name .fa{font-size:clamp(34px,5vw,46px);color:var(--orange);line-height:1.15}
.name .sl{color:var(--gold);font-size:24px}
.name .en{font-size:clamp(20px,3vw,27px);letter-spacing:.22em;text-transform:uppercase}
.ident p{margin:2px 0 0;color:var(--mute);font-size:18px;font-style:italic}
.ident p.hintro{font-style:normal;color:var(--ink);margin:10px auto 0;max-width:34em;text-align:center;text-indent:0}
html[dir=rtl] .ident p{font-style:normal}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 0 8px}
.treewrap{position:relative;flex:none;height:min(70svh,calc(100svh - 250px));min-height:260px;aspect-ratio:3/4}
.treewrap video{display:block;width:100%;height:100%;object-fit:cover;background:transparent;-webkit-mask-image:radial-gradient(ellipse 58% 56% at 50% 50%,#000 78%,transparent 100%);mask-image:radial-gradient(ellipse 58% 56% at 50% 50%,#000 78%,transparent 100%)}
.glow{position:absolute;width:56%;height:34%;border-radius:50%;opacity:0;transition:opacity .6s ease;mix-blend-mode:multiply;pointer-events:none;background:radial-gradient(closest-side,rgba(184,150,62,.5),rgba(184,150,62,0))}
.g1{inset-inline-start:-4%;top:12%}.g2{inset-inline-start:-4%;top:46%}.g3{inset-inline-end:-4%;top:12%}.g4{inset-inline-end:-4%;top:46%}
.note{position:absolute;display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-size:var(--note);line-height:1.2;padding:8px 0;white-space:nowrap;opacity:0;animation:fin 1.4s ease forwards;margin-top:-20px}
.note::before,.note::after{content:none;flex:none;width:var(--hl);height:1px;background:var(--gold);transition:background .4s}
.note.s{inset-inline-end:calc(100% - 7%)}.note.s::after{content:""}
.note.e{inset-inline-start:calc(100% - 7%)}.note.e::before{content:""}
.note:hover,.note:focus-visible{color:var(--lapis)}
.note:hover::before,.note:hover::after,.note:focus-visible::before,.note:focus-visible::after{background:var(--lapis)}
.n1{top:27%;animation-delay:.9s}.n2{top:60%;animation-delay:1.3s}.n3{top:27%;animation-delay:1.7s}.n4{top:60%;animation-delay:2.1s}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.treewrap:has(.n1:is(:hover,:focus-visible)) .g1,.treewrap:has(.n2:is(:hover,:focus-visible)) .g2,.treewrap:has(.n3:is(:hover,:focus-visible)) .g3,.treewrap:has(.n4:is(:hover,:focus-visible)) .g4{opacity:1}
@media(max-width:700px){
 .langtop.langsw{top:8px;right:12px}.ident{padding-top:44px}
 .stage{display:block;padding-bottom:36px}
 .treewrap{height:auto;aspect-ratio:auto;display:flex;flex-direction:column;align-items:center}
 .treewrap video{height:min(46svh,400px);width:auto;aspect-ratio:3/4}
 .glow{display:none}
 .note{position:static;margin:0;padding:10px 0}.note::before,.note::after{content:none!important}
 .n1{animation-delay:.6s}.n2{animation-delay:.9s}.n3{animation-delay:1.2s}.n4{animation-delay:1.5s}
}
.hintro{max-width:34em;margin:10px auto 0;color:var(--ink);font-size:18px;line-height:1.5}
.hcta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.hcta a{display:inline-block;padding:9px 24px;font-size:18px;text-decoration:none;border:1px solid var(--lapis);color:var(--lapis);min-height:44px}
.hcta a.p{background:var(--lapis);color:#F8F0E4}
.hcta a[hidden]{display:none}
.chs{max-width:880px;margin:0 auto;padding:56px 24px 80px}
.chs h2{font-weight:400;font-size:clamp(26px,4vw,36px);margin:0 0 4px}
.chs p.sub{color:var(--mute);margin:0 0 18px;font-size:16px}
.chs ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--gold)}
.chs li a{display:flex;align-items:baseline;gap:16px;padding:10px 4px;border-bottom:1px solid #E3D7B8;color:var(--ink);text-decoration:none;min-height:48px}
.chs li a:hover{background:rgba(46,74,158,.06)}
.chs .n{flex:none;width:2em;color:var(--orange);font-size:16px}
.chs .e{flex:1}.chs .f{font-family:"Noto Naskh Arabic",serif;font-size:21px;direction:rtl;color:var(--ink)}
.chs .c{color:var(--mute);font-size:13px;flex:none}
html[dir=rtl] .chs .n{text-align:start}
@media(max-width:700px){.hero{height:auto;min-height:0}.chs li a{flex-wrap:wrap;gap:2px 12px}.chs .e{flex-basis:calc(100% - 3em);order:2}.chs .f{order:1;flex:1}.chs .c{order:3}}
.story{max-width:880px;margin:0 auto;padding:88px 24px 72px;text-align:center}
.skick{margin:0 0 12px;display:flex;justify-content:center;align-items:baseline;gap:10px;color:var(--mute)}
.skick [lang=en]{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.skick [lang=fa]{font-family:"Noto Naskh Arabic",serif;font-size:16px}
.story h2{display:flex;flex-direction:column;align-items:center;margin:0 0 30px;font-weight:400}
.story h2 [lang=en]{font-size:clamp(30px,5vw,46px);line-height:1.2}
.story h2 [lang=fa]{font-family:"Noto Naskh Arabic",serif;font-size:clamp(24px,3.6vw,32px);line-height:1.7;color:var(--orange)}
html[dir=rtl] .story h2{flex-direction:column-reverse}
html[dir=rtl] .story h2 [lang=fa]{font-size:clamp(34px,5vw,48px);color:var(--ink)}
html[dir=rtl] .story h2 [lang=en]{font-size:clamp(20px,3vw,26px);color:var(--orange)}
.vwrap{position:relative;max-width:760px;margin:0 auto;aspect-ratio:4/3;background:#FAF2E1;outline:1px solid var(--gold)}
.vwrap video{display:block;width:100%;height:100%;object-fit:contain}
.vbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 22px;background:var(--bg);border:1px solid var(--gold);border-radius:0;color:var(--ink);font:inherit;font-size:18px;cursor:pointer}
.vbtn:hover{border-color:var(--orange);color:var(--orange)}
.vbtn:focus-visible,.vread:focus-visible{outline:2px solid var(--lapis);outline-offset:3px}
.vplay{position:absolute;inset:auto 0 5% 0;margin:0 auto;width:max-content;min-height:52px;font-size:20px;padding:10px 30px}
.vplay::before{content:"";border-left:13px solid currentColor;border-top:8px solid transparent;border-bottom:8px solid transparent}
html[dir=rtl] .vplay::before{transform:scaleX(-1)}
.vctl{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.vfail{position:absolute;inset:0;margin:0;padding:24px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--bg);color:var(--mute);font-size:18px}
.vread{display:inline-block;margin-top:26px;padding:10px 28px;min-height:44px;background:var(--lapis);color:#F8F0E4;border:1px solid var(--lapis);text-decoration:none;font-size:19px}
.vread:hover{background:var(--orange);border-color:var(--orange)}
.vcredit{max-width:36em;margin:18px auto 0;color:var(--mute);font-size:14px;line-height:1.5}
.story [hidden]{display:none!important}
@media(max-width:700px){.story{padding:56px 16px 48px}.vbtn{font-size:17px}}
@media(prefers-reduced-motion:reduce){.note{opacity:1}}
</style></head>
<body data-page="cover">
<div class="langtop langsw" role="group" aria-label="Language"><button data-lang="en">EN</button><span aria-hidden="true">/</span><button data-lang="fa">فارسی</button></div>
<div class="hero"><header class="ident"><div class="name"><span class="fa">حاشیه</span><span class="sl">/</span><span class="en">Hashiyeh</span></div><p data-k="tagline"></p><p class="hintro" data-k="intro"></p><div class="hcta"><a class="p" id="start" href="/read" data-k="start"></a><a id="cont" href="/read" hidden data-k="cont"></a></div></header>
<main class="stage">
<div class="treewrap">
<video id="tree" poster="/assets/cypress.jpg" muted loop playsinline autoplay preload="auto" role="img" data-alt="cypressAlt"><source src="/assets/cypress-wind.mp4" type="video/mp4"><source src="/assets/cypress-wind.webm" type="video/webm"></video>
<span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span><span class="glow g4"></span>
<a class="note s n1" href="/journey" data-title="nJourney"><span data-k="nJourney"></span></a>
<a class="note s n2" href="/tales" data-title="nTales"><span data-k="nTales"></span></a>

</div>

<video id="storyV" controls preload="none" playsinline width="1440" height="1080" poster="/assets/lion-hare-well-poster.jpg" aria-describedby="storyCredit"><source id="storySrc" src="/assets/lion-hare-well-v3.mp4" type="video/mp4"><a href="/read#shirogav/sh22">The Lion and the Hare · شیر و خرگوش</a></video>

<script src="/assets/site.js"></script>
<script>
H.add({en:{cypressAlt:"A Persian miniature-style cypress with flowering branches and two birds, moving gently in the wind. AI-generated."},fa:{cypressAlt:"سروی به شیوهٔ نگارگری ایرانی با شاخه‌های شکوفه و دو پرنده، که آرام در باد می‌جنبد. ساخته‌شده با هوش مصنوعی."}});

H.add({en:{intro:"Nasrollah Monshi's twelfth-century Persian prose Kelileh o Demneh, read in Persian from the first chapter to the last, with English summaries as drafts beside it.",start:"Start reading",cont:"Continue reading",chTitle:"The nineteen chapters",chSub:"Persian text from Ganjoor. Chapter titles in English are draft renderings.",sec:"sections"},
fa:{intro:"کلیله و دمنهٔ نصرالله منشی، نثر فارسی سدهٔ دوازدهم میلادی، به‌صورت کامل و فارسی از نخستین باب تا واپسین، با خلاصه‌های انگلیسی پیش‌نویس در کنار آن.",start:"آغاز خواندن",cont:"ادامهٔ خواندن",chTitle:"نوزده باب کتاب",chSub:"متن فارسی از گنجور. عنوان‌های انگلیسی بابها پیش‌نویس‌اند.",sec:"بخش"}});
fetch("/data/chapters.json").then(function(r){return r.json()}).then(function(L){function draw(){document.getElementById("chl").innerHTML=L.map(function(c){var n=H.lang==="fa"?String(c.n).replace(/\d/g,function(d){return "۰۱۲۳۴۵۶۷۸۹"[d]}):c.n;return '<li><a href="/read#'+c.slug+'"><span class="n">'+n+'</span><span class="e">'+H.esc(c.title_en)+'</span><span class="f">'+H.esc(c.title_fa)+'</span><span class="c">'+(H.lang==="fa"?String(c.sections).replace(/\d/g,function(d){return "۰۱۲۳۴۵۶۷۸۹"[d]}):c.sections)+" "+H.t("sec")+"</span></a></li>"}).join("")}draw();H.on(draw)}).catch(function(){});
try{var l=localStorage.getItem("hashiyeh-last");if(l&&/^[a-z0-9-]+\/sh\d+$/.test(l)){var a=document.getElementById("cont");a.href="/read#"+l;a.hidden=false}}catch(e){}

H.add({en:{vPlay:"Play",vPause:"Pause",vReplay:"Replay",readTale:"Read the tale",storyAlt:"Animated illustration: a lion leans over a stone well and looks at his reflection in the water; a hare sits beside the well.",storyCredit:"AI-generated illustration in the manner of Persian manuscript painting, animated for this project. Not a historical manuscript.",storyFail:"The animation could not be loaded. You can read the tale instead."},
fa:{vPlay:"پخش",vPause:"مکث",vReplay:"پخش دوباره",readTale:"خواندن حکایت",storyAlt:"تصویر متحرک: شیری بر چاهی سنگی خم شده و به بازتاب خود در آب می‌نگرد؛ خرگوشی کنار چاه نشسته است.",storyCredit:"تصویر ساخته‌شده با هوش مصنوعی به شیوهٔ نگارگری ایرانی، متحرک‌شده برای این پروژه. نسخهٔ خطی تاریخی نیست.",storyFail:"پویانمایی بارگذاری نشد. می‌توانید حکایت را بخوانید."}});
(function(){var $=function(i){return document.getElementById(i)},v=$("storyV"),big=$("vbig"),ctl=$("vctl"),tog=$("vtog"),fail=$("vfail");
v.removeAttribute("controls");big.hidden=false;
function lab(){big.textContent=H.t("vPlay");tog.textContent=H.t(v.paused||v.ended?"vPlay":"vPause");v.setAttribute("aria-label",H.t("storyAlt"));if(!fail.hidden)fail.textContent=H.t("storyFail")}
function started(){big.hidden=true;ctl.hidden=false;lab()}
function broke(){big.hidden=true;ctl.hidden=true;fail.hidden=false;fail.textContent=H.t("storyFail")}
function play(){var p=v.play();started();if(p&&p.catch)p.catch(function(){if(!v.error&&v.networkState!==3){lab()}else broke()})}
big.addEventListener("click",play);
tog.addEventListener("click",function(){v.paused||v.ended?play():v.pause()});
$("vrep").addEventListener("click",function(){v.currentTime=0;play()});
["play","pause","ended"].forEach(function(e){v.addEventListener(e,lab)});
$("storySrc").addEventListener("error",broke);v.addEventListener("error",broke);
if("IntersectionObserver" in window)new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting&&!v.paused)v.pause()})},{threshold:0.2}).observe($("vwrap"));
H.on(lab);lab()})();
H.init();
(function(){var v=document.getElementById("tree"),rm=matchMedia("(prefers-reduced-motion:reduce)");
function go(){if(rm.matches){v.pause();v.removeAttribute("autoplay")}else v.play&&v.play().catch(function(){})}go();
rm.addEventListener&&rm.addEventListener("change",go)})();
</script></body></html>
