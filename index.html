(function(){
var tree=document.getElementById("tree"),slot=document.getElementById("slot"),hero=document.getElementById("hero"),nav=document.querySelector("header nav");
var txt=hero.firstElementChild,rm=matchMedia("(prefers-reduced-motion:reduce)");
function cl(x){return Math.max(0,Math.min(1,x))}
var inflow=document.getElementById("inflow");
function vid(){var m=innerWidth<600||rm.matches;if(rm.matches){tree.pause();inflow.pause();return}if(innerWidth<600){tree.pause();inflow.play().catch(function(){})}else{inflow.pause();tree.play().catch(function(){})}}
function upd(){
 var vh=innerHeight,vw=innerWidth,desk=vw>=600,w0=Math.min(460,vw*.7,vh*.62);
 if(rm.matches){nav.style.opacity=1;txt.style.opacity=1;return}
 var p=cl(scrollY/(vh*.7)),e=p*p*(3-2*p);
 nav.style.opacity=e;nav.style.pointerEvents=e<.5?"none":"auto";
 var sr=slot.getBoundingClientRect(),x1=desk?sr.left+sr.width/2:vw/2,w1=desk?Math.min(sr.width,420):w0*.6;
 var x=vw/2+(x1-vw/2)*e,s=1+(w1/w0-1)*e,r=hero.getBoundingClientRect(),o;
 o=desk?cl((r.bottom-vh*.6)/(vh*.25)):1-cl(p*1.6);
 tree.style.width=w0+"px";tree.style.opacity=o;
 tree.style.transform="translate("+(x-w0/2)+"px,-50%) scale("+s+")";
 var t=cl((vh*.95-txt.getBoundingClientRect().top)/(vh*.4));
 txt.style.opacity=t;txt.style.transform="translateY("+(1-t)*24+"px)";
}
addEventListener("scroll",function(){requestAnimationFrame(upd)},{passive:true});addEventListener("resize",function(){upd();vid()});rm.addEventListener&&rm.addEventListener("change",upd);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(upd);upd();vid();
})();
