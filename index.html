<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hashiyeh · Kalila and Dimna, read in the margins</title>
<meta name="description" content="A digital reading of Nasrollah Monshi's Persian Kelileh o Demneh.">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.langtop{position:absolute;top:14px;right:20px;z-index:3}
.ident{text-align:center;padding:34px 20px 6px}
.name{display:flex;justify-content:center;align-items:baseline;gap:14px;direction:ltr}
.name .fa{font-size:clamp(38px,6vw,52px);color:var(--orange);line-height:1.2}
.name .sl{color:var(--gold);font-size:26px}
.name .en{font-size:clamp(22px,3.4vw,30px);letter-spacing:.22em;text-transform:uppercase}
.ident p{margin:6px 0 0;color:var(--mute);font-size:19px;font-style:italic}
html[dir=rtl] .ident p{font-style:normal}
.stage{flex:1;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:1fr 1fr;align-items:center;column-gap:clamp(16px,4vw,56px);width:100%;max-width:1100px;margin:0 auto;padding:10px 24px 22px}
.treewrap{grid-column:2;grid-row:1/3;position:relative;height:min(56svh,540px);aspect-ratio:3/4}
.treewrap video{display:block;width:100%;height:100%;object-fit:cover;background:transparent;-webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 5%,#000 95%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 5%,#000 95%,transparent);mask-composite:intersect}
.glow{position:absolute;width:62%;height:44%;border-radius:50%;opacity:0;transition:opacity .6s ease;mix-blend-mode:multiply;pointer-events:none;background:radial-gradient(closest-side,rgba(184,150,62,.5),rgba(184,150,62,0))}
@media(prefers-color-scheme:dark){.glow{mix-blend-mode:screen;background:radial-gradient(closest-side,rgba(184,150,62,.32),rgba(184,150,62,0))}}
.g1{inset-inline-start:-8%;top:2%}.g2{inset-inline-start:-8%;top:50%}.g3{inset-inline-end:-8%;top:2%}.g4{inset-inline-end:-8%;top:50%}
.note{display:block;color:var(--ink);text-decoration:none;font-size:clamp(19px,2.2vw,24px);padding:8px 0;opacity:0;animation:fin 1.4s ease forwards}
.note span{display:inline-block;padding-bottom:5px;border-bottom:1px solid var(--gold);transition:border-color .4s,color .4s}
.note:hover span,.note:focus-visible span{border-color:var(--lapis);color:var(--lapis)}
.n1{grid-column:1;grid-row:1;justify-self:end;text-align:end;align-self:start;margin-top:12%;animation-delay:.9s}
.n2{grid-column:1;grid-row:2;justify-self:end;text-align:end;align-self:end;margin-bottom:12%;animation-delay:1.3s}
.n3{grid-column:3;grid-row:1;justify-self:start;align-self:start;margin-top:12%;animation-delay:1.7s}
.n4{grid-column:3;grid-row:2;justify-self:start;align-self:end;margin-bottom:12%;animation-delay:2.1s}

@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stage:has(.n1:is(:hover,:focus-visible)) .g1,.stage:has(.n2:is(:hover,:focus-visible)) .g2,.stage:has(.n3:is(:hover,:focus-visible)) .g3,.stage:has(.n4:is(:hover,:focus-visible)) .g4{opacity:1}
@media(max-width:700px){
 .langtop{top:10px;right:14px}.ident{padding-top:44px}
 .stage{grid-template-columns:1fr;grid-template-rows:none;row-gap:0;justify-items:center;padding-bottom:36px}
 .treewrap{grid-column:1;grid-row:auto;height:min(46svh,400px)}
 .note{grid-column:1!important;grid-row:auto!important;justify-self:center!important;align-self:auto!important;text-align:center!important;margin:0!important;padding:10px 0}
 .n1{animation-delay:.6s}.n2{animation-delay:.9s}.n3{animation-delay:1.2s}.n4{animation-delay:1.5s}
}
@media(prefers-reduced-motion:reduce){.note{opacity:1}}
</style></head>
<body data-page="cover">
<div class="langtop langsw" role="group" aria-label="Language"><button data-lang="en">EN</button><span aria-hidden="true">/</span><button data-lang="fa">فارسی</button></div>
<header class="ident"><div class="name"><span class="fa">حاشیه</span><span class="sl">/</span><span class="en">Hashiyeh</span></div><p data-k="tagline"></p></header>
<main class="stage">
<div class="treewrap">
<video id="tree" poster="/assets/cypress.jpg" muted loop playsinline autoplay preload="auto" role="img" data-alt="cypressAlt"><source src="/assets/cypress-wind.mp4" type="video/mp4"><source src="/assets/cypress-wind.webm" type="video/webm"></video>
<span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span><span class="glow g4"></span>
</div>
<a class="note n1" href="/journey"><span data-k="nJourney"></span></a>
<a class="note n2" href="/tales"><span data-k="nTales"></span></a>
<a class="note n3" href="/method"><span data-k="nMethod"></span></a>
<a class="note n4" href="/about"><span data-k="nAbout"></span></a>
</main>
<script src="/assets/site.js"></script>
<script>
H.add({en:{cypressAlt:"A Persian miniature-style cypress with flowering branches and two birds, moving gently in the wind. AI-generated."},fa:{cypressAlt:"سروی به شیوهٔ نگارگری ایرانی با شاخه‌های شکوفه و دو پرنده، که آرام در باد می‌جنبد. ساخته‌شده با هوش مصنوعی."}});
H.init();
(function(){var v=document.getElementById("tree"),rm=matchMedia("(prefers-reduced-motion:reduce)");
function go(){if(rm.matches){v.pause();v.removeAttribute("autoplay")}else v.play&&v.play().catch(function(){})}go();
rm.addEventListener&&rm.addEventListener("change",go)})();
</script></body></html>
