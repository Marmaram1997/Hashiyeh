fa:[["۱","منبع متن","متن فارسی ویرایش گنجور از کلیله و دمنهٔ منشی است، با ۱۹ باب و ۲۵۰ بخش. هر جا قطعه‌ای با تصحیح مجتبی مینوی سنجیده شده باشد، خواننده در یادداشت حاشیه می‌گوید؛ تا اکنون فقط یک بیت عربی."],["۲","پیش‌نویس و بازبینی‌شده","هر چه ویراستار پروژه هنوز نسنجیده باشد در داده‌ها و رابط «پیش‌نویس» یا «تأییدنشده» نشان دارد: خلاصه‌های انگلیسی، راویان بیرون از هفت حکایت سنجیده، درخت حکایت‌ها بیرون از «شیر و گاو»، قطعه‌های عربیِ شناسایی‌شده، معنی‌های واژه‌نامه و ترجمهٔ عنوان بابها. پیشنهادهای مدل جدا از کار بازبینی‌شدهٔ انسانی می‌مانند."],["۳","انگلیسی","ترجمهٔ انگلیسیِ دامنه‌عمومی از فارسی منشی وجود ندارد. ترجمهٔ ثکستون (هکت، ۲۰۱۹) تنها ترجمهٔ نزدیک به کامل است و حق نشر دارد؛ پس در اینجا ارجاع داده می‌شود و بازنشر نمی‌شود. به همین سبب خواننده فقط فارسی نشان می‌دهد، با خلاصه‌های کوتاه انگلیسی و بعدها ترجمه‌های خود ویراستار."],["۴","نسخه‌های دیگر","انگلیسیِ کیث فالکونر (۱۸۸۵) از شاخهٔ سریانیِ متأخر است. نسخه‌ای همتبار است، نه ترجمهٔ منشی، و در صفحهٔ جداگانهٔ «نسخه‌های دیگر» آمده است."]]};
