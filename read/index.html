<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Read · Hashiyeh</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
:root{--arc:#5B6F4A;--sheet:rgba(31,27,22,.35)}
html[data-theme=dark]{--arc:#A9BF98}
@media(prefers-color-scheme:dark){html:not([data-theme]){--arc:#A9BF98}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* sticky bar */
.rbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--rule)}
.rb{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:6px 16px;font-size:15px}
.rb button,.rb select{font-size:14px;color:var(--ink);border:1px solid var(--line);background:transparent;padding:4px 10px;min-height:36px;border-radius:0}
.rb button[aria-pressed=true],.rb button[aria-expanded=true]{border-color:var(--lapis);color:var(--lapis)}
.rb select{max-width:210px;font-family:inherit}
.crumbs{flex:1 1 280px;min-width:0;color:var(--mute);font-size:14px;line-height:1.5}
.crumbs span+span::before{content:" › ";color:var(--gold)}
.crumbs .here{color:var(--ink)}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp{display:inline-flex}.grp button+button{margin-inline-start:-1px}
.grp .a1{font-size:13px}.grp .a2{font-size:16px}.grp .a3{font-size:19px}
.prog{height:3px;background:var(--rule)}.prog i{display:block;height:100%;width:0;background:var(--lapis)}
/* layout */
.rd{direction:ltr;display:grid;grid-template-columns:300px minmax(0,1fr);align-items:start}
.rd.collapsed{grid-template-columns:0 minmax(0,1fr)}
.rd.collapsed .side{visibility:hidden;overflow:hidden;border:0}
.side{position:sticky;top:var(--rbh,96px);height:calc(100vh - var(--rbh,96px));overflow:auto;border-inline-end:1px solid var(--rule);padding:14px 14px 80px;font-size:15px}
html[dir=rtl] .side{direction:rtl}
.tabs{display:flex;gap:4px;margin-bottom:10px}.tabs button{flex:1;border:1px solid var(--line);color:var(--ink);font-size:14px;min-height:36px}
.tabs button[aria-selected=true]{background:var(--lapis);border-color:var(--lapis);color:#F8F0E4}
.side .note{font-size:13px;color:var(--mute);margin:0 0 10px;line-height:1.5}
.tn{display:block;width:100%;text-align:start;padding:7px 8px;border-inline-start:3px solid transparent;border-top:1px solid var(--rule);color:var(--ink);min-height:40px}
.tn .f{font-family:"Noto Naskh Arabic",serif;font-size:17px;direction:rtl;display:block;text-align:start}
.tn .e{font-size:13px;color:var(--mute);display:block}
.tn .u{display:inline-block;font-size:11px;border:1px solid var(--gold);padding:0 6px;margin-top:2px;color:var(--mute)}
.tn[aria-current=true]{background:rgba(46,74,158,.09);border-inline-start-color:var(--lapis)}
.tn.anc{border-inline-start-color:var(--gold)}
.nest{margin-inline-start:14px;border-inline-start:1px solid var(--gold)}
.bmi{display:flex;gap:8px;align-items:center;border-top:1px solid var(--rule);padding:6px 0}.bmi a{flex:1;color:var(--ink);text-decoration:none}.bmi button{font-size:18px}
/* document */
.doc{min-width:0;padding:22px 20px 120px}
.chh{max-width:38em;margin:6px auto 26px;text-align:center}
.chh .k{margin-bottom:4px}
.chh h1{font-family:"Noto Naskh Arabic",serif;font-weight:600;font-size:32px;line-height:1.6;margin:0;direction:rtl}
.chh .en{color:var(--mute);font-size:17px}
.sec{max-width:38em;margin:0 auto 54px;scroll-margin-top:calc(var(--rbh,96px) + 10px)}
.sec.wide{max-width:min(1100px,100%)}
.sh{display:flex;align-items:center;gap:12px;direction:rtl;border-top:1px solid var(--gold);padding-top:10px;max-width:38em;margin:0 auto}
.snum{color:var(--orange);font-family:"Noto Naskh Arabic",serif;font-size:15px}
.stitle{flex:1;font-family:"Noto Naskh Arabic",serif;font-size:21px;font-weight:600;margin:0;line-height:1.6}
.bm{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--mute)}
.bm svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
.bm[aria-pressed=true]{color:var(--orange)}.bm[aria-pressed=true] svg{fill:currentColor}
.taleline{max-width:38em;margin:8px auto 0;direction:rtl;font-family:"Noto Naskh Arabic",serif;font-size:16px;color:var(--mute)}
.taleline b{color:var(--ink);font-weight:600}
.taleline .tl{display:inline-block;border:1px solid var(--line);padding:0 8px;margin-inline-start:8px;color:var(--ink);font-size:14px}
.taleline .tl i{font-style:normal;font-family:"EB Garamond",serif;direction:ltr;unicode-bidi:isolate;color:var(--mute)}
.sum{max-width:38em;margin:12px auto 0;border:1px solid var(--gold);padding:10px 14px;font-size:16px;line-height:1.55;direction:ltr;text-align:left}
.sum .lab{display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.badge{border:1px solid var(--orange);color:var(--orange);padding:0 7px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:34px;direction:ltr;margin-top:14px}
.txt{--fs:22px;font-family:"Noto Naskh Arabic",serif;font-size:var(--fs);line-height:2.25;direction:rtl;text-align:justify;margin-top:14px;max-width:38em;margin-inline:auto}
.pair .txt{margin-top:0;max-width:none}
.en-pg{font-size:calc(var(--fs) - 3px);line-height:1.65;direction:ltr;text-align:left}
.en-pg h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:400;margin:0 0 6px}
.txt p{margin:0 0 .7em}
.beyt{display:flex;justify-content:center;gap:0 3em;text-align:center;margin:.4em 0;line-height:2.1;flex-wrap:wrap}
.beyt span{flex:0 1 auto}
.vline{text-align:center;margin:.3em 0}
.ar{font-size:.92em;color:var(--arc)}
.has-tr{cursor:pointer;border-bottom:1px solid var(--arc)}
.gl{border-bottom:1px dotted var(--mute);cursor:help}
.ins{margin:.5em 0 .8em}
.mnote{font-size:13.5px;line-height:1.6;color:var(--mute);border-inline-start:2px solid var(--gold);padding-inline-start:10px;margin-top:4px;text-align:start;direction:rtl;font-family:"Noto Naskh Arabic",serif}
.mnote div[lang=en]{direction:ltr;font-family:"EB Garamond",Georgia,serif;font-size:14px;margin-top:4px;text-align:left}
#pop{position:fixed;z-index:50;max-width:300px;background:var(--card);color:var(--ink);border:1px solid var(--gold);padding:8px 12px;font-size:15px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#pop[hidden]{display:none}
#pop .w{font-family:"Noto Naskh Arabic",serif;font-size:18px;direction:rtl;display:block}
#pop .fa{display:block;font-size:16px}#pop .e{display:block;direction:ltr;text-align:left}
#pop small{display:block;color:var(--mute);margin-top:4px;font-size:12px;direction:ltr;text-align:left}
/* bottom bar */
.pn{position:fixed;bottom:0;inset-inline:0;z-index:15;background:var(--bg);border-top:1px solid var(--rule);display:flex;justify-content:center;align-items:center;gap:18px;padding:6px 12px;direction:ltr}
.pn button{border:1px solid var(--line);color:var(--ink);min-height:40px;padding:6px 16px;font-size:15px}
.pn button:disabled{opacity:.35;cursor:default}.pn .pos{color:var(--mute);font-size:14px;min-width:90px;text-align:center}
@media(max-width:860px){.pair{grid-template-columns:1fr}.pair .en-pg{order:2}}
@media(max-width:760px){
 .rd,.rd.collapsed{grid-template-columns:minmax(0,1fr)}
 .side,.rd.collapsed .side{position:fixed;inset:auto 0 0 0;top:auto;height:62vh;z-index:40;background:var(--bg);border:0;border-top:2px solid var(--gold);transform:translateY(105%);transition:transform .3s ease;visibility:visible;padding:16px 16px 70px}
 .rd.sheet .side{transform:none;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
 .sheetback{position:fixed;inset:0;background:var(--sheet);z-index:35}
 .sheetback[hidden]{display:none}
 .doc{padding:16px 14px 110px}.txt{--fs:20px}
 .rb{padding:6px 10px}.crumbs{flex-basis:100%;order:3}
 .stitle{font-size:19px}
}
@media(min-width:761px){.sheetback{display:none}}
</style></head><body data-page="read">
<header id="hdr" class="hdr"></header>
<h1 class="sr" data-k="h1"></h1>
<div class="rbar" id="rbar">
 <div class="rb">
  <button type="button" id="btnMap" aria-expanded="true" aria-controls="side" data-k="map"></button>
  <nav class="crumbs" id="crumbs" data-alt="crumbL"></nav>
  <div class="ctl">
   <select id="chSel" data-alt="chL"></select>
   <span class="grp" role="group" data-alt="fsL"><button type="button" class="a1" data-fs="0" aria-label="Small text">A</button><button type="button" class="a2" data-fs="1" aria-label="Medium text">A</button><button type="button" class="a3" data-fs="2" aria-label="Large text">A</button></span>
   <span class="grp" role="group" data-alt="thL"><button type="button" data-th="light" data-k="thLight"></button><button type="button" data-th="sepia" data-k="thSepia"></button><button type="button" data-th="dark" data-k="thDark"></button></span>
  </div>
 </div>
 <div class="prog" aria-hidden="true"><i id="bar"></i></div>
</div>
<div class="rd" id="rd">
 <aside class="side" id="side" data-alt="sideL">
  <div class="tabs" role="tablist"><button type="button" role="tab" id="tabMap" aria-selected="true" data-k="map"></button><button type="button" role="tab" id="tabBm" aria-selected="false" data-k="bm"></button></div>
  <div id="sideBody"></div>
 </aside>
 <main class="doc" id="doc"><p id="loading" class="chh" data-k="loading"></p></main>
</div>
<div class="sheetback" id="sheetback" hidden></div>
<div class="pn" id="pn"><button type="button" id="prev"></button><span class="pos" id="pos" aria-live="polite"></span><button type="button" id="next"></button></div>
<div id="pop" role="tooltip" hidden></div>
<script src="/assets/site.js"></script>
<script>
H.add({
en:{title:"Read",h1:"Kelileh o Demneh in Persian",map:"Story map",bm:"Bookmarks",loading:"Loading the text…",crumbL:"Where you are",chL:"Chapter",fsL:"Text size",thL:"Theme",sideL:"Story map and bookmarks",
 thLight:"Light",thSepia:"Sepia",thDark:"Dark",prev:"‹ Previous section",next:"Next section ›",secOf:"section %n of %t",summary:"English summary",draft:"draft",
 bmAdd:"Bookmark this section",bmDel:"Remove bookmark",noBm:"No bookmarks yet. Use the ribbon icon at the top of a section.",
 treeHand:"Hand-aligned tales of this chapter, with nesting.",treeAuto:"Tales guessed from text cues. Not verified; nesting is not detected.",treeNone:"No tale starts detected in this chapter.",unver:"unverified",
 glNote:"draft meaning, not verified",arNote:"Arabic. Translation:",ch:"Chapter",tales:"tale",tellsWord:"tells",open:"Open",
 notePrefix:"",transHead:"English translation"},
fa:{title:"خواندن",h1:"کلیله و دمنه به فارسی",map:"نقشهٔ حکایت‌ها",bm:"نشان‌ها",loading:"در حال بارگذاری متن…",crumbL:"جای شما در کتاب",chL:"باب",fsL:"اندازهٔ متن",thL:"پوسته",sideL:"نقشهٔ حکایت‌ها و نشان‌ها",
 thLight:"روشن",thSepia:"سپیا",thDark:"تیره",prev:"‹ بخش پیشین",next:"بخش بعد ›",secOf:"بخش %n از %t",summary:"خلاصهٔ انگلیسی",draft:"پیش‌نویس",
 bmAdd:"نشان‌گذاری این بخش",bmDel:"برداشتن نشان",noBm:"هنوز نشانی ندارید. از نماد نوار در بالای هر بخش استفاده کنید.",
 treeHand:"حکایت‌های همتراز‌شدهٔ این باب با دست، به‌همراه تودرتویی.",treeAuto:"حکایت‌هایی که از نشانه‌های متن حدس زده شده‌اند. تأییدنشده؛ تودرتویی شناسایی نشده است.",treeNone:"در این باب آغاز حکایتی شناسایی نشد.",unver:"تأییدنشده",
 glNote:"معنای پیش‌نویس، تأییدنشده",arNote:"عربی. ترجمه:",ch:"باب",tales:"حکایت",tellsWord:"می‌گوید",open:"باز کردن",
 notePrefix:"",transHead:"ترجمهٔ انگلیسی"}});
var $=function(i){return document.getElementById(i)},esc=function(s){return H.esc(s)};
var DB={},CH=[],SECS=[],SID={},curId=null,curCh=null,lastHash="";
var FSKEY="hashiyeh-fs",THKEY="hashiyeh-theme",BMKEY="hashiyeh-bookmarks",LASTKEY="hashiyeh-last";
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function fd(n){return String(n).replace(/\d/g,function(d){return "۰۱۲۳۴۵۶۷۸۹"[d]})}
function bms(){try{return JSON.parse(ls(BMKEY)||"[]")||[]}catch(e){return[]}}
function setBms(a){ls(BMKEY,JSON.stringify(a))}
var NORM=function(t){return t.replace(/[ً-ٰٟ‌]/g,"")};
/* ---------- data ---------- */
var FILES={book:"kelile_monshi",chapters:"chapters",tree:"tale_tree",tellers:"tellers",ar:"arabic_spans",artr:"arabic_translations",gl:"glossary",sum:"summaries_en",al:"lion_ox_aligned"};
function load(){return Promise.all(Object.keys(FILES).map(function(k){return fetch("/data/"+FILES[k]+".json").then(function(r){if(!r.ok)throw new Error(FILES[k]);return r.json()}).then(function(j){DB[k]=j})})).then(prep)}
function slugOf(u){return u.replace(/\/$/,"").split("/").pop()}
function prep(){
 CH=DB.book.chapters.map(function(c,i){var m=DB.chapters[i];c.n=i+1;c.title_en=m.title_en;c.sections.forEach(function(s,j){s.sid=c.slug+"/"+slugOf(s.url);s.chapter=c;s.idx=j;SECS.push(s);SID[s.sid]=s});return c});
 DB.arBy={};DB.ar.spans.forEach(function(s){if(s.inserted)return;var k=s.section+"|"+s.line;(DB.arBy[k]=DB.arBy[k]||[]).push(s)});
 for(var k in DB.arBy)DB.arBy[k].sort(function(a,b){return a.start-b.start});
 DB.glMap={};DB.gl.entries.forEach(function(e){e.forms.forEach(function(f){DB.glMap[NORM(f)]=e})});
 DB.nodes={};DB.tree.chapters.forEach(function(c){DB.nodes[c.chapter]=c.nodes});
 DB.insBy={};DB.al.tales.forEach(function(t){t.fa_sections.forEach(function(s){if(s.inserts)DB.insBy["shirogav/"+slugOf(s.url)]=s.inserts})});
 DB.taleBy={};DB.al.tales.forEach(function(t){DB.taleBy[t.id]=t});
 $("chSel").innerHTML=CH.map(function(c){return '<option value="'+c.slug+'">'+c.n+". "+esc(H.lang==="fa"?c.title:c.title_en)+"</option>"}).join("")}
/* ---------- text rendering ---------- */
function gloss(t){return esc(t).replace(/[ء-يٱ-ۓ]+/g,function(w){var e=DB.glMap[NORM(w)];return e?'<span class="gl" tabindex="0" data-g="'+esc(e.word)+'">'+w+"</span>":w})}
function line(v,sid){var sp=DB.arBy[sid+"|"+v.order],t=v.text,o="",c=0;
 (sp||[]).forEach(function(s){var tr=DB.artr.translations[s.id];o+=gloss(t.slice(c,s.start))+'<span class="ar'+(tr&&tr.translation_en?" has-tr":"")+'" '+(tr&&tr.translation_en?'tabindex="0" role="button" data-ar="'+s.id+'"':"")+' lang="ar">'+esc(t.slice(s.start,s.end))+"</span>";c=s.end});
 return o+gloss(t.slice(c))}
function insBlock(ins){var tr=DB.artr.translations["minovi_sh22"];return '<div class="ins"><div class="beyt"><span class="ar has-tr" lang="ar" tabindex="0" role="button" data-ar="minovi_sh22">'+esc(ins.hemistichs[0])+'</span><span class="ar has-tr" lang="ar" tabindex="0" role="button" data-ar="minovi_sh22">'+esc(ins.hemistichs[1])+'</span></div><div class="mnote"><div>'+esc(ins.note_fa)+'</div><div lang="en" dir="ltr">'+esc(ins.note_en)+"</div></div></div>"}
function body(s){var v=s.verses,ins=(DB.insBy[s.sid]||[])[0],skip={},o="";
 if(ins)ins.replaces_lines.forEach(function(i){skip[i]=1});
 for(var i=0;i<v.length;i++){
  if(ins&&i===ins.replaces_lines[0]){o+=insBlock(ins);continue}
  if(skip[i])continue;
  var x=v[i];
  if(x.pos===-1)o+="<p>"+line(x,s.sid)+"</p>";
  else if(x.pos===0&&v[i+1]&&v[i+1].pos===1&&!skip[i+1]){o+='<div class="beyt"><span>'+line(x,s.sid)+"</span><span>"+line(v[i+1],s.sid)+"</span></div>";i++}
  else o+='<div class="vline">'+line(x,s.sid)+"</div>"}
 return o}
function trans(s){var t=DB.sum.sections[s.sid];return t&&t.translation_en&&t.translation_en.trim()?t.translation_en:""}
function tellersFor(node){var t=DB.tellers.tellers[node.teller];return t||null}
function secHTML(s){
 var sm=DB.sum.sections[s.sid]||{},m=s.title.match(/^بخش\s*([\d۰-۹]+)\s*-?\s*(.*)$/),num=m?m[1]:"",name=m?m[2]:s.title;
 var tr=trans(s),bm=bms().some(function(b){return b.id===s.sid});
 var nodes=(DB.nodes[s.chapter.slug]||[]).filter(function(n){return n.section===s.sid&&n.source==="hand-aligned"});
 var tl=nodes.map(function(n){var t=tellersFor(n);return '<p class="taleline">حکایت: <b>'+esc(n.title_fa)+'</b>'+(t?'<span class="tl">'+esc(t.fa)+' <i>/ '+esc(t.en)+"</i></span>":"")+"</p>"}).join("");
 var sum=sm.summary_en?'<div class="sum" lang="en"><div class="lab"><span>'+H.t("summary")+"</span>"+(sm.status!=="reviewed"?'<span class="badge">'+H.t("draft")+"</span>":"")+"</div>"+esc(sm.summary_en)+"</div>":"";
 var txt='<div class="txt" lang="fa" dir="rtl">'+body(s)+"</div>";
 var main=tr?'<div class="pair"><div class="en-pg" lang="en"><h3>'+H.t("transHead")+"</h3>"+tr.split(/\n+/).map(function(p){return "<p>"+esc(p)+"</p>"}).join("")+"</div>"+txt+"</div>":txt;
 return '<article class="sec'+(tr?" wide":"")+'" id="s_'+s.sid.replace("/","_")+'" data-sid="'+s.sid+'"><header class="sh"><span class="snum">بخش '+esc(num)+'</span><h2 class="stitle">'+esc(name)+'</h2><button type="button" class="bm" data-bm="'+s.sid+'" aria-pressed="'+bm+'" title="'+H.t(bm?"bmDel":"bmAdd")+'" aria-label="'+H.t(bm?"bmDel":"bmAdd")+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button></header>'+tl+sum+main+"</article>"}
/* ---------- chapter / navigation ---------- */
function renderChapter(slug){var c=CH.find(function(x){return x.slug===slug});if(!c)return;curCh=c;
 $("chSel").value=slug;
 $("doc").innerHTML='<div class="chh"><p class="k">'+H.t("ch")+" "+(H.lang==="fa"?fd(c.n):c.n)+'</p><h1>'+esc(c.title)+'</h1><div class="en">'+esc(c.title_en)+"</div></div>"+c.sections.map(secHTML).join("");
 curId=null;buildSide();window.scrollTo(0,0)}
function go(sid,smooth){var s=SID[sid];if(!s)return;if(!curCh||curCh!==s.chapter)renderChapter(s.chapter.slug);
 var el=document.getElementById("s_"+sid.replace("/","_"));if(el){var rm=matchMedia("(prefers-reduced-motion:reduce)").matches;el.scrollIntoView({block:"start",behavior:smooth&&!rm?"smooth":"auto"})}
 setCur(sid,true)}
function resolveHash(h){h=decodeURIComponent((h||"").replace(/^#/,""));if(!h)return null;
 if(SID[h])return h;var c=CH.find(function(x){return x.slug===h});if(c)return c.sections[0].sid;
 var t=DB.taleBy[h];if(t)return "shirogav/"+slugOf(t.fa_sections[0].url);return null}
function nodeFor(sid){var ns=DB.nodes[SID[sid].chapter.slug]||[];return ns.filter(function(n){return(n.sections||[n.section]).indexOf(sid)>=0})}
function crumbs(sid){var s=SID[sid],c=s.chapter,out=[],fa=H.lang==="fa",ns=nodeFor(sid).filter(function(n){return n.source==="hand-aligned"});
 out.push('<span>'+esc(fa?c.title:c.title_en)+"</span>");
 if(ns.length){var n=ns[ns.length-1],chain=[],p=n;while(p){chain.unshift(p);p=p.parent?ns.concat(DB.nodes[c.slug]).find(function(x){return x.id===p.parent}):null}
  chain.forEach(function(x,i){if(i===chain.length-1){var t=tellersFor(x);if(t){var a=(fa?t.fa:t.en).split(fa?" ← ":" → ");out.push("<span>"+esc(a[0]+(fa?" برای "+a[1]+" "+H.t("tellsWord"):" "+H.t("tellsWord")+" "+a[1]))+"</span>")}}
   out.push('<span'+(i===chain.length-1?' class="here"':"")+">"+esc(fa?x.title_fa:x.title_en)+"</span>")})}
 else{var m=s.title.match(/^بخش\s*([\d۰-۹]+)/);out.push('<span class="here">'+(fa?"بخش "+(m?m[1]:""):"Section "+(s.idx+1))+"</span>")}
 $("crumbs").innerHTML=out.join("")}
function setCur(sid,force){if(sid===curId&&!force)return;curId=sid;var s=SID[sid];
 crumbs(sid);ls(LASTKEY,sid);
 var h="#"+sid;if(h!==lastHash){lastHash=h;try{history.replaceState(null,"",h)}catch(e){}}
