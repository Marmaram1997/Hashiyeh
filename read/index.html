<link rel="stylesheet" href="/assets/site.css">
<style>

.leaf,.stat{position:absolute;top:0;bottom:0;width:50%}

.toc .close{position:absolute;top:14px;right:16px;font-size:22px;min-width:44px;min-height:44px}
.cap{max-width:760px;margin:22px auto 0;font-size:15px;color:var(--mute);text-align:center}
.phonesw{display:none}
@media(max-width:760px){
 .stage{padding:8px 14px 0}

 .page.l,.page.r{border-radius:5px;box-shadow:1px 1px 0 var(--edge1),3px 2px 0 var(--edge2),0 10px 24px var(--shade)}
 .page{padding:20px 22px 2px}.himg{height:64px}

 .toc{padding:50px 16px 16px}.ti .e{max-width:48%;font-size:16px}.ti .f{max-width:48%;font-size:17px}

}
