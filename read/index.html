ی می‌دانم که آبش به صفا پرده‌درتر از گریه عاشق است و غمازتر از صبح صادق، دانه ریگ در قعر آن بتوان شمرد و بیضه ماهی از فراز آن بتوان دید. \nاگر بدان تحویل توانید کرد در امن و راحت و خصب و فراغت افتید.» گفتند: «نیکو رایی است. لکن نقل بی‌معونت و مظاهرت تو ممکن نیست.» گفت: «دریغ ندارم مدت گیرد و ساعت تا ساعت صیادان بیایند و فرصت فایت شود.» بسیار تضرع نمودند و منتها تحمل کردند تا بر آن قرارداد که هر روز چند ماهی ببردی و بر بالایی که در آن حوالی بود بخوردی. و دیگران در آن تحویل تعجیل و مسارعت می‌نمودند و با یک دیگر پیش‌دستی و مسابقت می‌کردند، و خود به چشم عبرت در سهو و غفلت ایشان می‌نگریست و به زبان عظت می‌گفت که: « هر که به لاوه دشمن فریفته شود و بر لئیم ظفر و بدگوهر اعتماد روا دارد سزای او اینست.»\nچون روزها بر آن گذشت پنج‌پایک هم خواست که تحویل کند. ماهی‌خوار او را بر پشت گرفت و روی بدان بالا نهاد که خوابگاه ماهیان بود. چون پنج‌پایک از دور استخوان ماهی دید بسیار، دانست که حال چیست. اندیشید که «خردمند چون دشمن را در مقام خطر بدید و قصد او در جان خود مشاهدت کرد اگر کوشش فروگذارد در خون خویش سعی کرده باشد؛ و چون بکوشید اگر پیروز آید نام گیرد، و اگر بخلاف آن کاری اتفاق‌افتد باری کرم و حمیت و مردانگی و شهامت او مطعون نگردد، و با سعادتِ شهادت او را ثواب مجاهدت فراهم آید.» پس خویشتن بر گردن ماهی‌خوار افگند و حلق او محکم بیفشرد چنانکه بیهوش از هوا درآمد و یکسر به زیارت مالک رفت. \nپنج‌پایک سر خویش گرفت و پای در راه نهاد تا به نزدیک بقیت ماهیان آمد، و تعزیت یاران گذشته و تهنیت حیات ایشان بگفت و از صورت حال اعلام داد. همگان شاد گشتند و وفات ماهی‌خوار را عمر تازه شمردند.\nمرا شربتی از پس بد سگال \nبود خوشتر از عمر هفتاد سال\nو این مثل بدان آوردم که بسیار کس به کید و حیلت، خویشتن را هلاک کرده است. لکن من ترا وجهی نمایم که اگر بر آن کار توانا گردی سبب بقای تو و موجب هلاک مار باشد.»» زاغ گفت: «از اشارت دوستان نتوان گذشت و رای خردمند را خلاف نتوان کرد.» شگال گفت: « صواب آن می‌نمایم که در اوج هوا پرواز کنی و در بامها و صحراها چشم می‌اندازی تا نظر بر پیرایه‌ای گشاده افگنی که ربودن آن میسر باشد. فرود آیی و آن را برداری و هموارتر می‌روی چنانکه از چشم مردمان غایب نگردی. چون نزدیک مار رسی  all these in a twinkling.' I know that when they return from their journey, they will not leave anything in this lake, and I shall utterly perish from life ! Then the crab spoke to the fishes. And all the fishes gathered to the heron, and said to him : ' Although you are an enemy to us, because we are your food and you feed on us, still he who has the fear of God, in time of trouble does not refuse what is right, or profane the emblem of the faith. Lo ! we are all knocking at your door, that you may hearken to us and ease the distress of our soul, and counsel us what to do in this distressful time.' The Heron. To do battle with the fishermen I am not able, and expel them from this region I cannot. But I know of a certain pool in which there is water abundant, fresh and clear. And there are green reeds in it. If you could remove thither from here, you would gain advantage to yourselves. The Fishes. But how is it possible for us to do so without your help ? The Heron. I will do what you wish and consent to you. But I am sore afraid of those fishermen, lest they come hastily. But I will begin to carry some of you every day, as many as I lo can, until I have exhausted (you and taken) you all away from here. And he began to carry off one or two every day, and to convey them to a certain region, and to eat them there; the others being ignorant of it. It came to pass one day (that) the crab said to the heron : ' I too find this place unpleasant. Pray carry me off too and convey me with my companions.' So the heron carried off the crab. When he reached the place where he had eaten the fishes, the crab beheld and saw the bones of his companions. And he perceived that the heron had done this wickedness, and was about to devour him too. And the crab said within himself : ' He that goes forth to battle and encounters his enemy wherever it may be, if he knows that his enemy will not hesitate to destroy him if he can, whether he make war with him (the enemy) or remain at peace with him, he ought to fight for himself (-12) strenuously, and not destroy himself for want of exertion. For if he is vanquished and perishes, still his honour goes with him, and his glory (remains) on his head.' Then the crab grasped the heron's throat with his pincers, and kept gripping him with his claws, until he throttled him and took away his life. So the crab escaped from slaughter. And he went little by little until he got (back) to the fishes, whom he acquainted with the story about the heron. The jackal said to the raven : 'This parable I have related to you, [that you may know] that when a man engages in fraudulent plans and transactions and schemes, his wickedness returns on his own head, and he himself perishes by his own artifices. But I will give you a piece of advice, so that if you can put my counsel into practice you may destroy the slayer of your young ones, without danger to yourself.' The Raven. What is the piece of advice, so that I may embrace it ? The Jackal. Fly upwards and hover in the air, and look about and see whether you can spy out of the trinkets belonging to the women on the housetops, one that is very precious and of great value. When you have taken it, do not soar very high, but fly a little and rise, and then descend again. And lo fly before all who see you gently and slowly, so that they may follow after you, until you reach the hole of the serpent your enemy. And whatever you have taken, introduce and place in the hole, that its owners may come and take it, and put an end to the serpent. So the raven flew away and soared, and, spying out an article of gold laid (in a place), took it according to the jackal's advice. And people saw her, and pursued after her till they arrived in sight of the serpent's hole. Then the raven went in, and put the necklace in the hole. And the j^eople coming up, took the necklace and killed the serpent.",

   "en_text": "The Lion. What is the story about them ? Dimnah. It is said that in a certain pool were three big fishes ; an intelligent one, a second who was more intelligent and prudent than he, and a third one lazy and forgetful. And no one (ever) approached that pond on account of its depth. But one day there passed by the pond two fishermen, skilful in their craft, who agreed with one another to cast their nets, and to bring about the capture of these fishes. But the intelligent and prudent fish, when he no more than scented the smell of a single word from the fishermen, made haste and got out of the pool by the conduit which brouglit the water into it, and saved himself from fear and distress of mind. But the one who was inferior to him in knowledge, remained in the pond until the fishermen came. And when he saw them he fell to deliberating and thinking, and began to form plans. And he said to himself : ' Now you need patient care, and if you strive cleverly, you will not fall into the net; but if you remain inactive and perplexed, you are doomed to destruction.' Then that reflection made itself a subtle plan , (namely) that he should throw himself on his back, like one that having been killed is dead in the water. And the fishermen began to dam up the conduit which brought the water. And they found this crafty one floating on the water after the manner of fishes who when dead float on the surface. Seeing him thus, they took him and put him on the bank of the other pool. And when he saw the fishermen wholly intent on the dam, he took a leap, fell into the water and escaped from them. But the lazy, idle one began to consider and hesitate until the fishermen caught him and look him. Nay, it seems to me, 0 king, that you must make haste and put the ox to death, before the thing becomes difficult, and gathers strength, and resists force.",

رکشی کرد، آخر رام شد و به دست آمد. اکنون تدبیر آنست که ما همه بر اشتر فراهم آییم، و ذکر شیر و رنجی که او را رسیده است تازه گردانیم، و گوییم «ما در سایه دولت و سامه حشمت این ملک روزگار خرم گذرانیده ایم. امروز که او را این رنج افتاد اگر به‌ همه نوع خویشتن بر او عرضه نکنیم و جان و نفس فدای ذات و فراغ او نگردانیم به کفران نعمت منسوب شویم، و به نزدیک اهل مروت بی قدر و قیمت گردیم. و صواب آنست که جمله پیش او رویم و شکر ایادی او باز رانیم، و مقرر گردانیم که از ما کاری دیگر نیاید، جانها و نفسهای ما فدای ملک است. و هریک از ما گوید: امروز چاشت ملک از من سازند. و دیگران آن را دفعی کنند و عذری نهند. بدین تودد حقی گزارده شود و ما را زیانی ندارد. »\nاین فصول با اشتر درازگردن کشیده بالا بگفتند، و بیچاره را به دمدمه در کوزه فقاع کردند، و با او قرار داده پیش شیر رفتند. و چون از تقریر ثنا و نشر شکر بپرداختند زاغ گفت: راحت ما به صحت ذات ملک متعلق است. و اکنون ضرورتی پیش آمده است، و از امروز ملک را از گوشت من سد رمقی حاصل تواند بود، مرا بشکند. دیگران گفتند: در خوردن تو چه فایده از گوشت تو چه سیری؟ ! شگال هم برآن نمط فصلی آغاز نهاد. جواب دادند که: گوشت تو بوی ناک و زیان کار است طعمه ملک را نشاید. گرگ هم بر این منوال سخنی بگفت. گفتند که: گوشت تو خناق آرد، قایم مقام زهر هلاهل باشد. \nاشتر این دم چون شکر بخورد و ملاطفتی نمود. همگنان یک کلمه شدند و گفتند:راست می‌گویی و از سر صدق عقیدت و فرط شفقت عبارت می‌کنی. یکبارگی در وی افتادند و پاره پاره کردند. \nو این مثل بدان آوردم که مکر اصحاب اغراض، خاصه که مطابقت نمایند، بی اثر نباشد."

   "en_text": "Dimnah. It is related about a bird called the sandpiper, that she and her mate formed the plan of building their nest on the sea-shore. When the time came for young ones, that is S for eggs, the hen-bird said to the cock : ' We must needs look out for some other place, lest, when we get young ones and before we have pleasure in them, the water of the sea destroy them,' The cock replied: 'This place is admirable for us, for it contains clear water and herbs of every kind. So let us lo produce our young ones here, and not fear. For the sea is great in his knowledge, and looks at far-off matters, and will be afraid of evil consequences, and (so) will not hurt us.' His mate said to him : '0 how weak is your mind and puffed up your spirit, and how simple is your knowledge, and how grand you are in your own eyes ; since you neither recognise your species, nor consider your own diminutiveness. For he who is wise and prudent compares himself only with that which is like him. So do not attempt a thing which is easy to you in empty speech, but far from you in deed. For nothing is more abominable before God, and more evil and hateful in the eyes of men, and weaker, than he who does not recognise his own nature and attempts things which are too high for him. Nay, listen to me, and do not resist and destroy our young ones as they are growing up and the time approaches for us to take pleasure in them and rejoice.' When the hen-bird saw that the cock resisted her words, and sought to go after his own desire, she said to him : ' When a man wishes to satisfy his longing, and does not take the advice of his friends and those who love him, that is, his welfare, and are anxious for his peace and wish for his advantage, there happens to him what happened to the tortoise, when she did not listen to profitable counsels.' The cock said : ' And what happened to her V The hen-bird replied : 'It is related that in a certain marsh abounding in water were two geese. There was also in that marsh a tortoise. And all three of them made friends with one another. When all the water in that lake had dried up, the geese said to one another: \"Let us depart hence and seek a place where there is clear water, free of evil mud, and herbage, and where we may find rest and build our nest.\" [And they said to the tortoise :] \" Lo we are going away now. Farewell.\" The tortoise said : \"As for you, my companions, it is easier for you to depart, and easier for you to remain on dry land, than for me. For I am an aquatic animal, and apart from water I should lose my life. Pray now deal kindly with me and save my life from destruction, and devise a plan for me that I too may depart with you.\" The geese replied: \"We will carry you, trusting that you will observe silence.\" The tortoise said : \" How can this be?\" The geese repUed: \"We can put down a stick, and do you take hold of the middle of the stick with your lo mouth ; and we will take hold of its ends and (then) fly.\" And the tortoise consented that they should do thus to her. So they put down the stick, and the tortoise took hold of the middle, and the geese took hold of its ends and flew. While they were flying, people saw (them) and wondered, and began to make sport and laugh, saying: \"See a great wonder, some geese carrying a tortoise and flying!\" When the tortoise perceived the large crowd shouting, she opened her mouth and said: [\"God pluck your eyes out, O people!\"] Whereupon, the tortoise fell from the stick and destroyed herself by her wilfulness and disobedience.' The cock-bird said : ' I hear what you say, and I tell you not to fear; because the sea is very wise, and will not dare to hurt us, since he is afraid of the consequences and considers the remote result of an action.' Then the hen-bird laid eggs; and when she had produced young ones, they rejoiced in them. But the sea had inclined his ear and heard everything that they said to one another, and wanted to know what the cock-bird could do to him. Then he lifted up his waves and took away the young ones, together with their nest. But he preserved them and did not destroy them, since he wished to know how matters would end. (And) the hen-bird said : ' This was pictured before my eyes when I told you that if you recognised your nature and remained in (an attitude befitting) your weakness, our young ones would not be lost to us, and you would not bring upon us this sorrow and sighing,' The cock-bird replied : ' And I too said to you that which I said. But now watch and see what I am about to do.' Then the cock-bird went to all the birds, and complained to them and informed them what the sea had done to him, and how he K. F. -A had wi'onged him by taking his cliildren and heirs from him. And he said to them: 'You all know that the trials of the world are many. And he who is tried resists and seeks assistance from his companions. But now I seek help from you all, that possibly I may be able by your intervention to exact vengeance from my oppressor.' The birds replied: 'Lo, we are all before you : tell us what you want.' The cock-bird said to them : ' The king of all the birds and the head of them is the Simurg. If we all go in a body to him and all lift up lo our voice in weeping and sighing, he Avill hear our voice and come out to us. And we will say to him : \" You are our King, and our glory and strength are you. And lo the sea has dared to wash away our young ones and our nest, and has bereaved us of our heirs. Pray now avenge us on him, because you are stronger than he,\" ' So all the birds came to the Simurg, and told him their whole story ; and the Simurg perceived that the sea was their oppressor. And the Simurg and the whole crowd of birds drew near to the sea and rebuked him, so that the sea took fright at them, made obeisance, and restored their young ones.",

   "en_text": "Dimnah. How runs the story about them ? Kalllah. It is related that a certain crafty rogue, and a certain innocent simpleton found on the road a purse containing a thousand darics. And the two being partners together in every transaction, when they reached their town sat down to divide them. (And) the simpleton said to his partner: 'Take the half of these darics, and give me half.' The crafty one, resolving in himself to take them (all) by fraud, replied: '(^ay) but let us take of them, you and I, as much as we need, and bury here what remains. And when we are in need again, we will take (more) of them ; because the blessing of God rests on partners so long as they are not separated from one another.' The simpleton replied: 'Be it as you say.' So they took a small quantity of the darics, and buried the remainder in the earth under a tree. Then that crafty rogue returned by another road and took away the darics, and returned to his house, after rearranging the place deceitfully and wrongfully. Some time having passed, the .simpleton said to the rogue : ' We are in need (of money) for expenses. Come, that we may take of those darics which God has supplied to us.' So the two went together, until they reached the tree. And they dug in that place and found nothing. Whereupon the rogue began to cry out, and pluck his hair, and strike his head, and beat upon his breast, and tear out the hair of his head and beard, and to lift up his voice and say : ' No one ought to be trusted in these times, and no one should believe in the good faith of his companion, nor a brother in his brother, nor a partner in his partner.' And he seized the simpleton harshly and wrongfully and said to him : ' You took a different road, and came and took the darics.' Then the poor simpleton began to swear and to curse himself, saying : ' I did not take anything, nor did I return to this place.' Then the rogue in his dishonesty seized him, led him to the judge, and related before him their whole story. Then the judge asked the rogue : ' Have you witnesses?' The rogue replied: 'The tree under which we placed them, will witness for me.' Then the judge wondered at his saying : * The tree will witness for me.' And he directed that a surety be taken from the simpleton for himself And the judge directed the surety to bring him on the morrow to that tree. And the rogue went to his house, and related his whole story to his father and said: 'O father, I told the judge that the tree would witness for me. So if it seems good to you, O father, we will go to the tree under cover of night, and do you get into a certain great cleft that is in the tree, that when the judge comes, you may witness for me in his presence, that this simpleton took these darics, so that by fraud we may not only take these darics, but return and take those (besides) which the simpleton has taken.' Then the silly man consented to his dishonest son, and went and hid himself in the cleft of the tree. And the judge rose up early in the morning, and the poor simpleton and the greedy rogue. The judge, having approached the tree, said to it : ' Which of these two partners took those darics, which were placed under your roots? Fear God and lie not; because, according to the word of your mouth I shall issue judgement against the guilty one and cause the oppressed to prevail over his oppressor. Woe from God on the oppressor !' Then the shameful old man in confusion opened his mouth within the cleft and said : ' The simpleton took the dinars.' And directly he had spoken, he came out of the cleft and hid himself above on one of the branches of the tree. Then the judge was astonished, and collected all his wits, and began to look here and there, until he saw that cleft in the tree. But he did not see any one in it, because the old man who witnessed had got high up in the tree, whither a man's sight could not reach. And they brought a number of logs of wood, placed them in the cleft of the tree, and
