<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Read · Hashiyeh</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
.wrap{display:grid;grid-template-columns:270px 1fr;gap:20px;max-width:1100px;margin:auto;padding:10px 28px 40px}
.rnav{position:sticky;top:12px;align-self:start}
.rnav h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:8px 0}
.rnav button{display:block;width:100%;text-align:start;background:none;border:0;border-inline-start:2px solid var(--rule);padding:6px 10px;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.rnav button.child{margin-inline-start:16px;width:calc(100% - 16px)}
.rnav button .fa{font-size:15px;color:var(--mute);display:block}
.rnav button.on{border-inline-start-color:var(--orange);color:var(--orange)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--mute);margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:18px 20px}
.col h3{margin:0 0 2px;font-size:19px}.col .src{font-size:13px;color:var(--mute);margin-bottom:12px}
.col a{color:var(--orange)}
.fa-col{direction:rtl;font-family:"Noto Naskh Arabic",serif;font-size:17px;line-height:2.1}
.fa-col .sec{font-size:12px;color:var(--mute);margin:14px 0 4px}
.fa-col p{margin:0 0 6px;white-space:pre-wrap}
.en-col{direction:ltr;text-align:left;font-family:"EB Garamond",Georgia,serif;line-height:1.6}
.absent{color:var(--mute);font-style:italic}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.rnav{position:static}.cols{grid-template-columns:1fr}}
@media(max-width:700px){.wrap{padding:10px 20px 40px}}
</style></head><body data-page="read"><header id="hdr" class="hdr"></header>
<main class="w" style="padding:0"><section class="w pagehead" style="padding-bottom:6px"><p style="margin:0 0 14px;font-size:15px"><a id="backmap" href="/tales" data-k="backMap"></a></p><p class="k" data-k="kicker"></p><h1 class="big" style="font-size:clamp(28px,4.4vw,44px)" data-k="h1"></h1><p class="lead" style="font-size:19px" data-k="intro"></p></section>
<div class="wrap"><nav class="rnav" aria-label="Tales"><h2 data-k="talesH"></h2><div id="tree"></div></nav>
<div><div class="meta" id="meta"></div><div class="cols"><div class="col fa-col" id="fa"></div><div class="col en-col" id="en"></div></div></div></div>
<footer class="w foot" style="margin-top:0"><span data-k="foot"></span></footer></main>
<script src="/assets/site.js"></script>
<script>
H.add({en:{title:"Read",backMap:"← Back to the map of tales",kicker:"The side-by-side reader",h1:"The Lion and the Ox: one chapter, two branches",intro:"Naṣrullāh Munshī’s Persian (12th c.) next to the later Syriac version in Keith-Falconer’s English (1885). Both come down from Ibn al-Muqaffaʿ's Arabic. The English is a sibling version, not a translation of Monshi. Tales are nested the way the book nests them.",talesH:"Tales in the chapter",foot:"Persian: ganjoor.net, whole sections that contain each tale (frame dialogue included). English: archive.org OCR of Keith-Falconer, Kalilah and Dimnah (Cambridge 1885), after OCR post-correction: a model fixed only clear scanning errors, every change is logged in the project repository, and the corrections have not yet been checked by a human. Prototype, first pass.",told:"Told by",pending:"not yet checked",nested:"Nested inside",words:"Persian %p words · English %e words",srcEn:"Later Syriac, tr. Keith-Falconer 1885 · OCR lines %l · model-corrected, not yet human-reviewed",absentH:"Not in this branch",absent:"The later Syriac version has no frog-and-crab tale inside “The Rogue and the Simpleton”. This one shows up in the Persian only.",noEn:"(not in the Syriac)"},
fa:{title:"خواندن",backMap:"→ بازگشت به نقشهٔ حکایت‌ها",kicker:"خوانش دوستونه",h1:"شیر و گاو: یک باب، دو شاخه",intro:"نثر فارسی نصرالله منشی (سدهٔ ششم هجری) در کنار نسخهٔ سریانیِ متأخر، در ترجمهٔ انگلیسی کیث فالکونر (۱۸۸۵). هر دو از عربیِ ابن مقفع می‌آیند. متن انگلیسی نسخه‌ای همتبار است، نه ترجمهٔ منشی. حکایت‌ها همان‌گونه که در کتاب تودرتو آمده‌اند.",talesH:"حکایت‌های باب",foot:"فارسی: گنجور، بخش‌های کامل شامل هر حکایت (با گفتگوی چارچوب). انگلیسی: OCR آرشیو اینترنتی از کیث فالکونر، کلیله و دمنه (کمبریج ۱۸۸۵)، پس از پساصلاح OCR: یک مدل فقط خطاهای آشکار اسکن را اصلاح کرده، همهٔ تغییرها در مخزن پروژه ثبت شده و هنوز انسانی بازبینی نشده‌اند. نمونهٔ اولیه، گام نخست.",told:"راوی",pending:"هنوز بررسی نشده",nested:"درون",words:"فارسی %p واژه · انگلیسی %e واژه",srcEn:"سریانیِ متأخر، ترجمهٔ کیث فالکونر ۱۸۸۵ · سطرهای OCR %l · اصلاح‌شده با مدل، هنوز بازبینی انسانی نشده",absentH:"در این شاخه نیست",absent:"در نسخهٔ سریانیِ متأخر، حکایت غوک و مار درون «دو شریک» نیست. این حکایت فقط در متن فارسی آمده است.",noEn:"(در سریانی نیست)"}});
var D=null;
var VER=["ape_carpenter","three_fishes","camel","sandpiper","apes_glowworm","two_partners","tortoise_geese"];
var cur=null;
function esc(s){return H.esc(s)}
function build(){var tree=document.getElementById("tree");tree.innerHTML="";
D.tales.forEach(function(t){var b=document.createElement("button");b.className=t.parent?"child":"";b.dataset.id=t.id;
var en=t.en_title||H.t("noEn");b.innerHTML=(H.lang==="fa"?'<span style="font-size:16px">'+esc(t.fa_title)+'</span><span class="fa" style="direction:ltr;text-align:start;font-size:13px">'+esc(en)+"</span>":esc(en)+'<span class="fa" style="text-align:start;direction:rtl">'+esc(t.fa_title)+"</span>");
b.onclick=function(){show(t.id)};tree.appendChild(b)})}
function show(id){cur=id;var t=D.tales.find(function(x){return x.id===id});
document.querySelectorAll("#tree button").forEach(function(b){b.classList.toggle("on",b.dataset.id===id)});
var par=t.parent?D.tales.find(function(x){return x.id===t.parent}):null,fa=H.lang==="fa";
var teller=VER.indexOf(t.id)>=0?t.teller:H.t("pending");
document.getElementById("meta").innerHTML="<span>"+H.t("told")+": "+esc(teller)+"</span>"+(par?"<span>"+H.t("nested")+": "+esc(fa?par.fa_title:par.en_title)+"</span>":"")+"<span>"+H.t("words").replace("%p",t.fa_words).replace("%e",t.en_words)+"</span>";
document.getElementById("fa").innerHTML='<h3>'+esc(t.fa_title)+'</h3><div class="src">نصرالله منشی</div>'+t.fa_sections.map(function(s){return '<div class="sec"><a href="'+s.url+'">'+esc(s.title)+"</a></div>"+s.text.split("\n").map(function(p){return "<p>"+esc(p)+"</p>"}).join("")}).join("");
document.getElementById("en").innerHTML=t.en_text?"<h3>"+esc(t.en_title)+'</h3><div class="src">'+H.t("srcEn").replace("%l",t.en_source_lines.join("–"))+"</div><p>"+esc(t.en_text)+"</p>":"<h3>"+H.t("absentH")+'</h3><p class="absent">'+H.t("absent")+"</p>";
try{history.replaceState(null,"","#"+id)}catch(e){}document.getElementById("backmap").href="/tales#"+id;
var ft=document.getElementById("meta");}
function draw(){if(!D)return;build();var h=location.hash.slice(1);show(cur||(D.tales.some(function(t){return t.id===h})?h:"lion_hare"))}
H.on(draw);H.init();
fetch("/data/lion_ox_aligned.json").then(function(r){return r.json()}).then(function(d){D=d;draw()}).catch(function(){document.getElementById("en").textContent="Data could not be loaded. Serve the site with npm run dev."});
</script></body></html>
